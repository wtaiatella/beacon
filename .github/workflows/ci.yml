name: CI

# Validates workspace integrity through relationship-based checks (ported from
# .gitlab-ci.yml — this framework now targets GitHub, not GitLab, for personal
# use). No hardcoded counts — validation adapts as files are added/removed.
#
# Checks the canonical source under agentic/ — .claude/ and .cursor/ are
# 100% generated by scripts/setup-agentic.sh and gitignored, so they never
# exist in a CI checkout.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell Syntax Check
        run: |
          FAIL=0
          for f in agentic/hooks/*.sh agentic/adapters/*/hooks/*.sh scripts/tools/*.sh scripts/setup.sh scripts/setup-agentic.sh scripts/upgrade.sh; do
            [ -f "$f" ] || continue
            HEAD=$(head -1 "$f")
            if ! echo "$HEAD" | grep -q '#!/usr/bin/env bash\|#!/bin/bash'; then
              echo "WARN $f -- non-standard shebang"
            fi
            if bash -n "$f" 2>/dev/null; then
              echo "OK $f"
            else
              echo "FAIL $f -- syntax error"; bash -n "$f" 2>&1 || true; FAIL=1
            fi
          done
          test "$FAIL" -eq 0 || exit 1

  executable-bits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executable Permissions
        run: |
          FAIL=0
          for f in agentic/hooks/*.sh agentic/adapters/*/hooks/*.sh scripts/tools/*.sh scripts/setup.sh scripts/setup-agentic.sh scripts/upgrade.sh; do
            [ -f "$f" ] || continue
            if [ -x "$f" ]; then
              echo "OK $f"
            else
              echo "FAIL $f -- not executable (needs chmod +x)"; FAIL=1
            fi
          done
          test "$FAIL" -eq 0 || exit 1

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets Scan
        run: |
          FAIL=0
          if find . -name '.env' -o -name '.env.*' 2>/dev/null | grep -v node_modules | grep -q .; then
            echo "FAIL .env file(s) found in repo"
            find . -name '.env' -o -name '.env.*' 2>/dev/null | grep -v node_modules
            FAIL=1
          fi
          test "$FAIL" -eq 0
          echo "OK No .env files committed"

  agent-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent Validation (content lint)
        run: ./scripts/tools/lint-workspace-agents.sh

  skill-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill Validation
        run: |
          FAIL=0
          for f in $(find agentic/skills -name 'SKILL.md'); do
            BASENAME=$(echo "$f" | sed 's|agentic/skills/||')
            DASHES=$(grep -c '^---$' "$f" || true)
            if [ "$DASHES" -lt 2 ]; then
              echo "FAIL $BASENAME -- missing YAML frontmatter"; FAIL=1; continue
            fi
            FM=$(sed -n '/^---$/,/^---$/p' "$f" | head -10)
            echo "$FM" | grep -q '^name:' || { echo "FAIL $BASENAME -- missing name"; FAIL=1; continue; }
            echo "$FM" | grep -q '^description:' || { echo "FAIL $BASENAME -- missing description"; FAIL=1; continue; }
            echo "OK $BASENAME"
          done
          test "$FAIL" -eq 0 || exit 1

  json-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON Validation
        run: |
          python3 -c "import json; json.load(open('.mcp.json')); print('OK .mcp.json')"
          python3 -c "import json; json.load(open('agentic/adapters/cursor/hooks.json')); print('OK agentic/adapters/cursor/hooks.json')"
          python3 -c "import json; json.load(open('agentic/adapters/claude/settings.json')); print('OK agentic/adapters/claude/settings.json')"

  router-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Router Rule
        run: |
          RULE="agentic/adapters/cursor/rules/00-workspace-router.mdc"
          test -f "$RULE" || { echo "FAIL $RULE missing"; exit 1; }
          grep -q 'alwaysApply.*true' "$RULE" || { echo "FAIL $RULE -- must have alwaysApply true"; exit 1; }
          echo "OK Router rule valid"

  workspace-lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Workspace lint-check
        run: ./scripts/tools/lint-check.sh .

  hooks-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Hooks Sync (hooks.json <-> scripts, by basename)
        run: |
          FAIL=0
          # hooks.json commands reference the *installed* .cursor/hooks/beacon/<name>.sh
          # path, which never exists in a CI checkout (.cursor/ is generated +
          # gitignored) — match by basename against the canonical source instead.
          CMDS=$(python3 <<'PY'
          import json
          h = json.load(open('agentic/adapters/cursor/hooks.json'))
          for ev in h.get('hooks', {}).values():
              for e in ev:
                  print(e['command'])
          PY
          )
          BASENAMES=$(echo "$CMDS" | xargs -n1 basename | sort -u)
          for b in $BASENAMES; do
            if [ -f "agentic/hooks/$b" ] || [ -f "agentic/adapters/cursor/hooks/$b" ]; then
              echo "OK $b (referenced in hooks.json, found in agentic/)"
            else
              echo "FAIL hooks.json references $b but no agentic/hooks/$b or agentic/adapters/cursor/hooks/$b"; FAIL=1
            fi
          done
          for f in agentic/hooks/*.sh agentic/adapters/cursor/hooks/*.sh; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            if echo "$BASENAMES" | grep -qx "$b"; then
              echo "OK $b registered in hooks.json"
            else
              echo "FAIL $b not registered in agentic/adapters/cursor/hooks.json"; FAIL=1
            fi
          done
          test "$FAIL" -eq 0 || exit 1

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Documentation Check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET="${{ github.event.pull_request.base.sha }}"
          else
            TARGET="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$TARGET"...HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "Changed files:" && echo "$CHANGED" && echo ""
          WARN=0
          if echo "$CHANGED" | grep -q 'agentic/agents/'; then
            if ! echo "$CHANGED" | grep -q 'README.md'; then
              echo "WARN Agent files changed but README.md was not updated"; WARN=1
            fi
            if ! echo "$CHANGED" | grep -q '00-workspace-router.mdc'; then
              echo "WARN Agent files changed but router rule was not updated"; WARN=1
            fi
          fi
          if echo "$CHANGED" | grep -qE 'agentic/hooks/.*\.sh|agentic/adapters/.*/hooks/.*\.sh'; then
            if ! echo "$CHANGED" | grep -q 'agentic/adapters/cursor/hooks.json'; then
              echo "WARN Hook scripts changed but hooks.json was not updated"; WARN=1
            fi
          fi
          if echo "$CHANGED" | grep -q 'agentic/skills/'; then
            if ! echo "$CHANGED" | grep -q '00-workspace-router.mdc'; then
              echo "WARN Skills changed but router rule was not updated"; WARN=1
            fi
          fi
          if [ "$WARN" -gt 0 ]; then
            echo ""
            echo "Documentation warnings detected (non-blocking). See CONTRIBUTING.md."
          else
            echo "OK All documentation in sync"
          fi
          echo "── Nested Task agent wording (warnings-only) ──"
          ./scripts/tools/check-nested-task-docs.sh
          echo "── Plan segment doc signals (warnings-only) ──"
          ./scripts/tools/check-plan-segment-docs.sh
          echo "── Pre-plan orchestration docs (blocking) ──"
          ./scripts/tools/verify-preplan-orchestration-docs.sh
          echo "── QA / Git / Finish boundaries (blocking) ──"
          ./scripts/tools/verify-qa-git-boundaries.sh
          echo "── Task(do) / session / router (blocking) ──"
          ./scripts/tools/verify-taskdo-session-boundaries.sh
          echo "── manual checklist — paths & optional md links (blocking) ──"
          ./scripts/tools/verify-phased-implementation-checklist-links.sh

  test-session-trace-transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Session trace / transcript (audit, query, session-memory ordering)
        run: |
          bash scripts/tools/tests/test-audit-session-trace.sh
          bash scripts/tools/tests/test-query-transcript.sh
          bash scripts/tools/tests/test-session-memory-ordering.sh

  test-workspace-multiroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Workspace / multi-root --help + integration tests
        run: |
          ./scripts/tools/cursor-project-hash.sh --help >/dev/null
          bash scripts/tools/tests/test-cursor-project-hash.sh
          ./scripts/tools/generate-code-workspace.sh --help >/dev/null
          ./scripts/tools/attach-project.sh --help >/dev/null
          echo "OK cursor-project-hash, generate-code-workspace, attach-project --help"
          bash scripts/tools/tests/test-generate-code-workspace.sh
          bash scripts/tools/tests/test-git-inspect.sh
          bash scripts/tools/tests/test-pipeline-finish.sh

  test-shell-encapsulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Shell encapsulation (pipeline-init, git-inspect, pipeline-finish, log-gate)
        run: bash scripts/tools/tests/test-shell-encapsulation-scripts.sh
